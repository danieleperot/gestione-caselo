services:
  eventform:
    build: ./backend/eventform
    ports:
      - "8080:8080"
    env_file:
      - ./backend/eventform/.env
    environment:
      - AWS_REGION=eu-south-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - cognito-local
    volumes:
      - ./backend/eventform:/app
    networks:
      - caselo-network
    develop:
      watch:
        - action: rebuild
          path: ./backend/eventform

  emails:
    build: ./backend/emails
    env_file:
      - ./backend/emails/.env
    environment:
      - AWS_REGION=eu-south-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      - elasticmq
      - localstack
    volumes:
      - ./backend/emails:/app
    networks:
      - caselo-network
    develop:
      watch:
        - action: rebuild
          path: ./backend/emails

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      - VITE_API_URL=http://localhost:8080/graphql
    networks:
      - caselo-network
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
        - action: restart
          path: ./frontend/.env

  cognito-local:
    image: jagregory/cognito-local:latest
    stop_grace_period: "1s"
    ports:
      - "9229:9229"
    volumes:
      - cognito-data:/app/.cognito
    networks:
      - caselo-network

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    networks:
      - caselo-network

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ses
      - AWS_DEFAULT_REGION=eu-south-1
      - DEBUG=1
      - SMTP_HOST=mailpit:1025
    volumes:
      - localstack-data:/var/lib/localstack
    networks:
      - caselo-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - caselo-network

networks:
  caselo-network:
    driver: bridge

volumes:
  pnpm-store:
  cognito-data:
  localstack-data:
