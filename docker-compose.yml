services:
  eventform:
    build:
      context: ./backend
      dockerfile: eventform/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./backend/eventform/.env
    environment:
      - AWS_REGION=eu-south-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_QUEUE_URL=http://elasticmq:9324/000000000000/emails
      - AWS_ENDPOINT_URL=http://elasticmq:9324
    depends_on:
      - elasticmq
    volumes:
      - ./backend/eventform:/app
    networks:
      - caselo-network
    develop:
      watch:
        - action: rebuild
          path: ./backend/eventform

  emails:
    build:
      context: ./backend
      dockerfile: emails/Dockerfile
    environment:
      - AWS_REGION=eu-south-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - ADMIN_EMAILS=admin@local.test,manager@local.test
      - FROM_ADDRESS=noreply@local.test
    depends_on:
      - localstack
    networks:
      - caselo-network

  emails-poller:
    build: ./local/email-poller
    environment:
      - AWS_REGION=eu-south-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_QUEUE_URL=http://elasticmq:9324/000000000000/emails
      - LAMBDA_URL=http://emails:8080/2015-03-31/functions/function/invocations
    depends_on:
      - emails
      - elasticmq
    networks:
      - caselo-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      - VITE_API_URL=http://localhost:8080/graphql
    networks:
      - caselo-network
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
        - action: restart
          path: ./frontend/.env

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    networks:
      - caselo-network

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ses,ssm
      - AWS_DEFAULT_REGION=eu-south-1
      - DEBUG=1
    volumes:
      - localstack-data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    networks:
      - caselo-network

networks:
  caselo-network:
    driver: bridge

volumes:
  pnpm-store:
  localstack-data:
