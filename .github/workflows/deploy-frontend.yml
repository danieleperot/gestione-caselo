name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [stage, prod]

    # Require manual approval for production
    environment: ${{ matrix.environment == 'prod' && 'production' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        env:
          VITE_ENV: ${{ matrix.environment }}
        run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gestione-caselo-global-github-actions-frontend-${{ matrix.environment }}
          aws-region: eu-south-1

      - name: Deploy to S3
        run: |
          # Upload assets with long cache (content-hashed files)
          aws s3 sync frontend/dist/ s3://gestione-caselo-${{ matrix.environment }}-frontend/ \
            --delete \
            --cache-control "max-age=31536000,public,immutable" \
            --exclude "index.html"

          # Upload index.html with no cache
          aws s3 cp frontend/dist/index.html \
            s3://gestione-caselo-${{ matrix.environment }}-frontend/ \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Get CloudFront Distribution ID
        id: cloudfront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[0].DomainName=='gestione-caselo-${{ matrix.environment }}-frontend.s3.eu-south-1.amazonaws.com'].Id" \
            --output text)
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront cache
        if: steps.cloudfront.outputs.distribution_id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cloudfront.outputs.distribution_id }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployed successfully"
          echo "Bucket: s3://gestione-caselo-${{ matrix.environment }}-frontend"
          echo "Environment: ${{ matrix.environment }}"
          echo "Deployer: ${{ github.actor }}"
