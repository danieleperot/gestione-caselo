include classpath("application.conf")

// Node configuration
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

// Queue definitions
queues {
  emails {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    fifo = false
  }

  // Add more queues here as needed
  // example-queue {
  //   defaultVisibilityTimeout = 10 seconds
  //   delay = 5 seconds
  //   receiveMessageWait = 0 seconds
  // }
}
